<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Garden preview</title>
<style>:root{--bg:#F6EEDF;--card:#FFFDF8;--ink:#13324A;--muted:#4F6475;--line:#E8DCC6;--accent:#237566;--accentSoft:#E2EFEA;--chip:#EDE2CC}body{margin:0;font-family:sans-serif}iframe{display:block;border:0;width:390px;height:844px}</style></head><body>
<script>
// ?phone: iPhone-sized (390 x 844) frame. ?egg: a new game (egg). ?hatch: tap the egg 3 times (design screen). ?menu: open the menu. Otherwise a hatched penpen.
if (/phone/.test(location.search)) { document.write('<iframe src="garden-preview.html' + location.search.replace('phone', 'x') + '"></iframe>'); }
else {
  localStorage.setItem('pp_sound','off');
  if (/egg|hatch/.test(location.search)) localStorage.removeItem('pp_pet');
  else localStorage.setItem('pp_pet',JSON.stringify({v:2,name:'Pip',look:{body:'#E87EA1',eyes:'lashes',beak:'#D9534F',feet:'#9AA7B4'},food:70,joy:70,energy:80,xp:60,coins:42,bag:{fish:3,mango:2,sushi:1,bat:1},own:{none:1,hat:1},wear:'hat',asleep:false,t:Date.now()}));
  ['../place.js','../guides.js','../games.js','../play.js'].forEach(function (s) { document.write('<script src="' + s + '"><\/script>'); });
  document.write('<script>window.ppOpenPlay();if(/menu/.test(location.search))setTimeout(function(){document.querySelector("#pp-play details.gmenu").open=true},300);if(/hatch/.test(location.search))setTimeout(function(){for(var i=0;i<3;i++)document.getElementById("pp-egg").click()},300);<\/script>');
}
</script>
</body></html>
