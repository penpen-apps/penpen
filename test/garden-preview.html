<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Screens preview</title>
<style>:root{--bg:#F6EEDF;--card:#FFFDF8;--ink:#13324A;--muted:#4F6475;--line:#E8DCC6;--accent:#237566;--accentSoft:#E2EFEA;--chip:#EDE2CC}body{margin:0;font-family:sans-serif}iframe{display:block;border:0;width:390px;height:844px}</style></head><body>
<script>
// temporary preview (removed before merge): ?phone-igloo, ?phone-quiz, ?phone-shop, ?phone-dive, ?phone-dive-go, ?phone-chase-back ... show a screen in an iPhone-sized (390 x 844) frame
if (/phone/.test(location.search)) { document.write('<iframe src="garden-preview.html' + location.search.replace('phone', 'x') + '"></iframe>'); }
else {
  localStorage.setItem('pp_sound','off');localStorage.setItem('pp_pet',JSON.stringify({v:2,name:'Pip',look:{body:'#5DA9E9',eyes:'shine',beak:'#F4A62A',feet:'#F4A62A'},st:{swim:14,run:9,power:4,stamina:7,charm:11},food:70,joy:70,energy:80,xp:60,coins:42,bag:{fish:3},own:{none:1,hat:1},wear:'none',asleep:false,t:Date.now()}));
  ['../place.js','../guides.js','../games.js','../play.js'].forEach(function (s) { document.write('<script src="' + s + '"><\/script>'); });
  document.write('<script>window.ppOpenPlay();setTimeout(function(){var q=location.search.replace("?x-",""),k=q.split("-")[0];if(!k||k==="x"||k==="drive")return;var m=document.querySelector("details.gmenu");if(m)m.open=true;var g={dive:1,chase:1,honk:1,slide:1}[k];if(k==="igloo"||g)document.querySelector(".gmenu [data-act=igloo]").click();else document.querySelector("[data-tab=" + k + "]").click();if(g){var b=document.getElementById("pp-iplay");b.dataset.play=k;b.click();if(/-go/.test(q))document.querySelector(".gstart").click();if(/-back/.test(q))document.querySelector(".gback").click();}},300);<\/script>');
  document.write('<script>setTimeout(function(){var q=location.search,me=function(){return document.getElementById("pp-walk")};if(!/x-drive/.test(q))return;document.getElementById("pp-drive").click();var W=document.getElementById("pp-world"),w=W.clientWidth,h=W.clientHeight,K=Math.max(w/1080,h/600),O=(1080*K-w)/2,at=function(x,y){var m=me();m.style.transition="none";m.style.left=((x*K-O)/w*100)+"%";m.style.bottom=((600-y)*K/h*100)+"%";};if(/-pick/.test(q)||/-hold/.test(q)){var f=[].slice.call(document.querySelectorAll("#pp-world [id^=pp-fl]")).map(function(g){var c=g.querySelectorAll("circle"),m=c[c.length-1];return[+m.getAttribute("cx"),+m.getAttribute("cy")];}).filter(function(a){return a[1]>430&&a[1]<500&&a[0]>470&&a[0]<620;})[0];at(f[0],f[1]);if(/-hold/.test(q))setTimeout(function(){document.getElementById("pp-gact").click();},600);}if(/-pond/.test(q)){at(830,380);setTimeout(function(){document.getElementById("pp-gact").click();},600);}},900);<\/script>');
}
</script>
</body></html>
